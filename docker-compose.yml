services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: football_backend_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_HOSTNAME: db
      DB_NAME: football_backend_dev
      API_SPORT_FOOTBALL_API_KEY: ${API_SPORT_FOOTBALL_API_KEY:-}
      FOOTBALL_SEASON: ${FOOTBALL_SEASON:-2024}
      FOOTBALL_DATA_TOKEN: ${FOOTBALL_DATA_TOKEN:-}
      FOOTBALL_COMPETITION: ${FOOTBALL_COMPETITION:-PL}
      MIX_ENV: dev
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - build_data:/app/_build
      - deps_data:/app/deps

volumes:
  db_data:
  build_data:
  deps_data:
